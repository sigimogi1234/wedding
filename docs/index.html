<style>
  /* Layout concept: an architect's paper model of a small town, seen from above, on the wedding day. */
  #scene { position: absolute; inset: 0; overflow: hidden; touch-action: none; background: var(--grain), #eaecdd; }

  .fig .inner { position: relative; width: 100%; height: 100%; transform-origin: 50% 100%; }
  .fig::before { content: ""; position: absolute; left: 8px; bottom: -3px; width: 28px; height: 9px; border-radius: 50%; background: rgba(70, 58, 46, .22); }

  .fig.guest .inner { animation: sway 2.4s ease-in-out infinite alternate; }

  .fig.open .inner { animation: sway 2.4s ease-in-out infinite alternate, hop .42s ease-out 1; }

  .door-mark { width: 46px; height: 27px; margin: -13px 0 0 -23px; border: 1.5px dashed var(--brass); border-radius: 50%; z-index: 2; transition: background .2s, border-style .2s; }

  /* 이동은 터치, 입장은 건물 터치 또는 문 앞 버튼 */
  #tint, #snowcover { left: -760px; top: -320px; width: 1520px; height: 2120px; }

  /* 봉투 → 편지 → 양쪽으로 열려 마을로 이어지는 한 장면 */

  #intro.clear { background: none; }
  .env { position: absolute; left: 50%; top: 50%; width: 310px; height: 208px; margin: -104px 0 0 -155px; transition: transform .75s cubic-bezier(.5, 0, .7, .3), opacity .6s; }
  .env.away { transform: translateY(70vh); opacity: 0; }
  .env-back { position: absolute; inset: 0; z-index: 1; background: #d8cbb5; box-shadow: 0 14px 30px rgba(70, 58, 46, .2); }

  .flap { position: absolute; inset: 0 0 auto; height: 128px; z-index: 4; background: var(--grain), #dfd2bc; clip-path: polygon(0 0, 100% 0, 50% 100%); transform: perspective(900px) rotateX(0); transform-origin: top; transition: transform .55s, z-index 0s .27s; }
  .seal { position: absolute; z-index: 5; left: 50%; top: 96px; width: 62px; height: 62px; margin-left: -31px; border-radius: 50%; background: var(--accent); box-shadow: inset 0 0 0 3px rgba(251, 247, 238, .2), 0 3px 8px rgba(64, 57, 51, .3); color: var(--paper-hi); font: italic 30px/58px var(--latin); text-align: center; transition: opacity .25s, scale .25s; animation: seal 1.6s ease-in-out infinite alternate; }
  @keyframes seal { to { scale: 1.07; } }
  .env.open .flap { transform: perspective(900px) rotateX(180deg); z-index: 0; }
  .env.open .seal { opacity: 0; animation: none; scale: 1.4; pointer-events: none; }
  .env-note { position: absolute; left: 0; right: 0; top: calc(50% + 136px); margin: 0; color: var(--ink-soft); font-size: 15px; text-align: center; transition: opacity .3s; }

  #paper { position: absolute; z-index: 2; transition: top 1s cubic-bezier(.3, .8, .3, 1), clip-path 1s cubic-bezier(.3, .8, .3, 1); }
  #paper.grow { clip-path: none !important; z-index: 6; transition: left .8s cubic-bezier(.4, 0, .2, 1), top .8s cubic-bezier(.4, 0, .2, 1), width .8s cubic-bezier(.4, 0, .2, 1), height .8s cubic-bezier(.4, 0, .2, 1); }
  .leaf { position: absolute; top: 0; bottom: 0; width: 50.2%; background: var(--grain), var(--paper-hi); transition: transform 1.05s cubic-bezier(.5, 0, .25, 1), opacity .4s .65s; }

  #paper.grow .frame { inset: 14px; }
  .invite { position: absolute; left: 0; right: 0; top: 50%; display: grid; justify-items: center; gap: 3px; text-align: center; transform: translateY(-50%); transition: top .8s cubic-bezier(.4, 0, .2, 1), transform .8s cubic-bezier(.4, 0, .2, 1), opacity .25s; }
  #paper.grow .invite { top: 46px; transform: none; }

<body>

  <div class="top">

<script>
(function () {
  const { doll } = W;
  const app = document.getElementById('app');
  const scene = document.getElementById('scene');
  const world = document.getElementById('world');
  W.mount(app);
  W.musicButton(document.getElementById('music'));
  document.getElementById('summary').addEventListener('click', W.openSummary);
  document.getElementById('card-date').textContent = W.fmtDate();
  app.addEventListener('contextmenu', (e) => { if (!e.target.closest('input,textarea')) e.preventDefault(); });

  /* ---------- 좌표: u, v는 땅 위의 위치. s=u+v는 화면 세로, d=v-u는 화면 가로 축 ---------- */
  const CX = .866, CY = .5, ZOOM = .68, DOOR_LINE = 182;
  const pr = (u, v, z = 0) => [(u - v) * CX, (u + v) * CY - z];
  const fromSD = (s, d) => [(s - d) / 2, (s + d) / 2];

  function shade(hex, f) {
    const n = parseInt(hex.slice(1), 16);
    const c = (x) => Math.round(Math.min(255, x * f)).toString(16).padStart(2, '0');
    return '#' + c(n >> 16) + c((n >> 8) & 255) + c(n & 255);
  }

  // 건물은 치수만 주면 면을 투영해서 그린다
  function makeArt(b) {
    const out = [], lights = [];
    const { w, d } = b;
    const pts = (a) => a.map((p) => p[0].toFixed(1) + ',' + p[1].toFixed(1)).join(' ');
    const poly = (a, fill) => out.push(`<polygon points="${pts(a)}" fill="${fill}"/>`);
    const faces = {
      U: { p: (t, z, off = 0) => pr(w / 2 + off, d / 2 - t, z), L: d, f: 1 },
      V: { p: (t, z, off = 0) => pr(-w / 2 + t, d / 2 + off, z), L: w, f: .9 },
    };
    const a = {
      poly,
      quad(F, t0, t1, z0, z1, fill, off = 0) { const p = faces[F].p; poly([p(t0, z0, off), p(t1, z0, off), p(t1, z1, off), p(t0, z1, off)], fill); },
      arch(F, t0, t1, z0, z1, fill, off = 0) {
        const p = faces[F].p, r = (t1 - t0) / 2, c = t0 + r, list = [p(t0, z0, off)];
        for (let i = 0; i <= 12; i++) { const th = Math.PI - (i / 12) * Math.PI; list.push(p(c + Math.cos(th) * r, z1 + Math.sin(th) * r, off)); }
        list.push(p(t1, z0, off));
        poly(list, fill);
        return list;
      },
      circle(F, t, z, r, fill) {
        const p = faces[F].p, list = [];
        for (let i = 0; i < 24; i++) { const th = (i / 24) * Math.PI * 2; list.push(p(t + Math.cos(th) * r, z + Math.sin(th) * r, .5)); }
        poly(list, fill);
      },
      face: (F) => faces[F].p,
      line(F, t0, z0, t1, z1, color, width, cls = '') {
        const p = faces[F].p, A = p(t0, z0, 1), B = p(t1, z1, 1);
        out.push(`<line class="${cls}" x1="${A[0].toFixed(1)}" y1="${A[1].toFixed(1)}" x2="${B[0].toFixed(1)}" y2="${B[1].toFixed(1)}" stroke="${color}" stroke-width="${width}" stroke-linecap="round"/>`);
      },
      win(F, t, z, ww, hh) {
        a.arch(F, t - ww / 2 - 2, t + ww / 2 + 2, z - 2, z + hh, '#efe6d6');
        lights.push(a.arch(F, t - ww / 2, t + ww / 2, z, z + hh, '#8c9ba3'));
        a.line(F, t, z, t, z + hh + ww / 2, '#efe6d6', 1);
        a.quad(F, t - ww / 2 - 3, t + ww / 2 + 3, z - 7, z - 2, '#b5c4a7');
        for (let i = -1; i <= 1; i++) a.circle(F, t + i * ww * .32, z - 1.5, 2.2, i ? '#e6bdb8' : '#f6e6b8');
      },
      heart(F, t, z, r, fill) {
        const p = faces[F].p, list = [];
        for (let i = 0; i < 32; i++) { const th = (i / 32) * Math.PI * 2, sn = Math.sin(th); list.push(p(t + r * sn * sn * sn, z + r * (.8 * Math.cos(th) - .3 * Math.cos(2 * th) - .12 * Math.cos(3 * th)), .6)); }
        poly(list, fill);
      },
      box(cu, cv, bw, bd, z0, z1, wall) {
        const P = (x, y, z) => pr(cu + x, cv + y, z), hw = bw / 2, hd = bd / 2;
        poly([P(-hw, hd, z0), P(hw, hd, z0), P(hw, hd, z1), P(-hw, hd, z1)], shade(wall, .88));
        poly([P(hw, hd, z0), P(hw, -hd, z0), P(hw, -hd, z1), P(hw, hd, z1)], wall);
        poly([P(-hw, -hd, z1), P(hw, -hd, z1), P(hw, hd, z1), P(-hw, hd, z1)], shade(wall, 1.05));

        queue.push([ni, nj]);
      }
    }
    if (!hit) return [];
    const raw = [];
    for (let c = hit; c; c = prev.get(toKey(c[0], c[1]))) raw.unshift([c[0] * CELL, c[1] * CELL]);
    raw.push([tu, tv]);
    const clear = (A, B) => { const n = Math.ceil(Math.hypot(B[0] - A[0], B[1] - A[1]) / 8); for (let i = 1; i < n; i++) if (!free(A[0] + (B[0] - A[0]) * i / n, A[1] + (B[1] - A[1]) * i / n)) return false; return true; };
    const out = [];
    let at = [fu, fv], i = 0;
    while (i < raw.length) {
      let j = raw.length - 1;
      while (j > i && !clear(at, raw[j])) j--;
      out.push(raw[j]); at = raw[j]; i = j + 1;
    }
    return out;
  }

  const me = document.createElement('div');

  const actBtn = document.getElementById('act'), placesBtn = document.getElementById('places');
  let [u, v] = fromSD(1960, 0);
  let camX = pr(u, v)[0], camY = pr(u, v)[1], vw = app.clientWidth, vh = app.clientHeight;
  let path = [], goal = null, fast = 1, stuck = 0, footAcc = 0, footSide = 1, footIdx = 0, busy = false, near = null, last = 0, started = false;
  let myLook = W.GUESTS[0];
  const visited = new Set();
  const keys = new Set();

  function renderPlacesBtn() { placesBtn.textContent = `둘러본 곳 ${visited.size} / ${PLACES.length}`; }
  renderPlacesBtn();

  world.insertAdjacentHTML('beforeend', '<svg id="route" aria-hidden="true"><polyline/></svg>');

  destEl.innerHTML = '<svg viewBox="0 0 44 60" aria-hidden="true"><ellipse cx="22" cy="55" rx="11" ry="4" fill="rgba(70,58,46,.22)"/><path d="M22 44S6 33 6 19A9 9 0 0 1 22 13 9 9 0 0 1 38 19C38 33 22 44 22 44z" fill="#96695b" stroke="#fbf7ee" stroke-width="2"/></svg>';

  function settle(a, b) { const su = u, sv = v; u = a; v = b; pushOut(); const r = [u, v]; u = su; v = sv; return r; }

    el.animate([{ transform: 'scale(1,1)' }, { transform: 'scale(1.04,.95)' }, { transform: 'scale(.98,1.03)' }, { transform: 'scale(1,1)' }], { duration: 340, easing: 'ease-out' });

  function burst(x, y, n, colors, spread = 70) {

  function finale() {

    setTimeout(() => W.openSheet({

    }), 900);
  }
  actBtn.addEventListener('click', () => { if (near) enter(near); });

  placesBtn.addEventListener('click', () => {
    let close = null;

      html: PLACES.map((p, i) => `<button class="place-row${visited.has(p.key) ? ' done' : ''}" data-i="${i}"><b>${p.nav}</b><span>${p.sign}${visited.has(p.key) ? ' ✓' : ''}</span></button>`).join(''),

    });
  });

  let touch = null, lastDrag = 0;
  function toWorld(cx, cy) {
    const r = scene.getBoundingClientRect();
    return [(cx - r.left - vw / 2) / ZOOM + camX, (cy - r.top - vh * ANCHOR) / ZOOM + camY];
  }
  // 화면 좌표(건물 그림 포함)를 땅 위 좌표로 되돌린다
  const unproject = (wx, wy) => { const a = wx / CX, b = wy / CY; return [(a + b) / 2, (b - a) / 2]; };

  scene.addEventListener('pointerdown', (e) => {
    if (busy || touch) return;
    touch = { id: e.pointerId, x: e.clientX, y: e.clientY, moved: false };
  });
  window.addEventListener('pointermove', (e) => {
    if (!touch || e.pointerId !== touch.id) return;
    if (Math.hypot(e.clientX - touch.x, e.clientY - touch.y) > 12) touch.moved = true;
    const now = performance.now();
    if (touch.moved && now - lastDrag > 130) {
      lastDrag = now;
      const [wx, wy] = toWorld(e.clientX, e.clientY);
      walkGround(...unproject(wx, wy));
    }
  });
  function release(e) {
    if (!touch || e.pointerId !== touch.id) return;
    const t = touch;
    touch = null;
    if (t.moved || busy) return;
    tapAt(...toWorld(e.clientX, e.clientY));
  }
  function tapAt(wx, wy) {
    if (Math.abs(wx - balloons.x) < 48 && wy > balloons.y - 134 && wy < balloons.y - 30) { releaseBalloon(); return; }
    const person = npcs.find((n) => Math.abs(wx - n.x) < 34 && wy > n.y - 120 && wy < n.y + 14);
    if (person) { pinned = person; pinnedUntil = performance.now() + 1700; W.sfx('tap'); return; }
    if (Math.hypot((wx - fx) / 1.7, wy - fy + 12) < 52) { burst(fx, fy - 26, 16, WATER, 80); W.sfx('splash'); return; }
    const hit = PLACES.slice().sort((a, b) => b.cy - a.cy).find((p) => {
      const dx = Math.abs(wx - p.cx), half = (p.w + p.d) / 2;
      const onSign = dx < 90 && Math.abs(wy - (p.cy - p.h - p.top - 34)) < 26;
      const onBody = dx < half * CX + 6 && wy > p.cy - p.h - p.top && wy < p.cy + half * CY - dx * .577 + 6;
      return onSign || onBody;
    });
    if (hit) { walkTo(hit); return; }
    ripple(wx, wy);
    W.sfx('tap');
    walkGround(...unproject(wx, wy));
  }
  window.addEventListener('pointerup', release);
  window.addEventListener('pointercancel', (e) => { if (touch && e.pointerId === touch.id) touch = null; });

  const KEYMAP = { ArrowUp: [0, -1], ArrowDown: [0, 1], ArrowLeft: [-1, 0], ArrowRight: [1, 0] };
  window.addEventListener('keydown', (e) => {
    if (e.target.matches && e.target.matches('input,textarea') || !started) return;
    if (KEYMAP[e.key]) { keys.add(e.key); e.preventDefault(); clearRoute();  }
    if (e.key === 'Enter' && near && !busy && document.activeElement === document.body) enter(near);
  });
  window.addEventListener('keyup', (e) => keys.delete(e.key));

  const SPEED = 290, ANCHOR = .73, GOING_DOWN = .3, TOP_EDGE = -130, BOTTOM_EDGE = 1560;
  let aimTarget = ANCHOR, aim = ANCHOR;
  let pinned = null, pinnedUntil = 0, talking = null;
  const ticker = document.getElementById('ticker');
  function frame(now) {
    const dt = Math.min(.05, (now - last) / 1000 || 0);
    last = now;
    vw = app.clientWidth; vh = app.clientHeight;
    let sx = 0, sy = 0;
    keys.forEach((k) => { sx += KEYMAP[k][0]; sy += KEYMAP[k][1]; });
    const mag = Math.hypot(sx, sy);
    if (mag > 1) { sx /= mag; sy /= mag; }
    let du = 0, dv = 0, moving = false, faceX = 0, faceY = 0;
    if (!busy && (sx || sy)) {
      const px = sx * SPEED, py = sy * SPEED;
      du = (px / CX + py / CY) / 2 * dt;
      dv = (py / CY - px / CX) / 2 * dt;
      faceX = sx; faceY = sy; moving = true;
    } else if (!busy && path.length) {
      const [tu, tv] = path[0], ax = tu - u, ay = tv - v, dist = Math.hypot(ax, ay);
      const perUnit = dist > .01 ? Math.hypot((ax - ay) * CX, (ax + ay) * CY) / dist : 1, step = SPEED * fast * dt / perUnit;
      if (dist <= step) { u = tu; v = tv; path.shift(); }
      else { du = ax / dist * step; dv = ay / dist * step; }
      faceX = (ax - ay); faceY = (ax + ay); moving = true;
      if (path.length === 0) {
        const p = goal;
        if (p) p.plaque.classList.remove('target');
        goal = null;
        routeEl.style.display = destEl.style.display = 'none';
        if (p) enter(p);
      }
    }
    if (du || dv) {
      const bu = u, bv = v;
      u += du; v += dv; pushOut();
      const went = Math.hypot(u - bu, v - bv);
      if (path.length) {
        stuck = went < Math.hypot(du, dv) * .25 ? stuck + 1 : 0;
        if (stuck > 14) clearRoute();
      }
      footAcc += went;
      if (footAcc > 26) {
        footAcc = 0; footSide = -footSide;
        const f = FOOTS[footIdx++ % FOOTS.length], [fxx, fyy] = pr(u + footSide * 4, v - footSide * 4);
        f.style.left = fxx + 'px'; f.style.top = fyy + 'px';
        f.animate([{ opacity: .55 }, { opacity: 0 }], { duration: 1300 });
      }
    }
    me.classList.toggle('walk', moving);
    if (faceX) me.classList.toggle('left', faceX < 0);
    if (Math.abs(faceY) > .05) me.classList.toggle('back', faceY < 0);

    const [x, y] = pr(u, v);
    me.style.left = x + 'px'; me.style.top = y + 'px'; me.style.zIndex = Math.round(y);
    if (path.length) routeLine.setAttribute('points', [[x, y], ...path.map(([a, b]) => pr(a, b))].map((c) => c[0].toFixed(1) + ',' + c[1].toFixed(1)).join(' '));
    camX += (x - camX) * .16;
    if ((du || dv) && Math.abs(du + dv) * CY > Math.abs(du - dv) * CX * .35) aimTarget = du + dv < 0 ? ANCHOR : GOING_DOWN;
    aim += (aimTarget - aim) * Math.min(1, dt * 6);
    const scale = vh / ZOOM;
    const wantCam = Math.max(TOP_EDGE + scale * ANCHOR, Math.min(BOTTOM_EDGE - scale * (1 - ANCHOR), y - (aim - ANCHOR) * scale));
    camY += (wantCam - camY) * .22;
    world.style.transform = `translate3d(${Math.round(vw / 2 - camX * ZOOM)}px,${Math.round(vh * ANCHOR - camY * ZOOM)}px,0) scale(${ZOOM})`;

    // 하객을 누르면 메시지가 화면 위쪽에 잠깐 나타난다
    const nearest = pinned && now < pinnedUntil ? pinned : null;
    if (nearest !== talking) {
      if (talking) talking.el.classList.remove('open');
      talking = nearest;
      if (talking) {
        talking.el.classList.add('open');
        ticker.innerHTML = `${W.esc(talking.letter.text)}<small>${W.esc(talking.letter.name)}</small>`;
      }
      ticker.classList.toggle('on', !!talking);
    }

    let found = null;
    if (!busy && !path.length) found = PLACES.find((p) => Math.hypot(u - p.fu, v - p.fv) < 56) || null;
    if (found !== near) {
      if (near) near.mark.classList.remove('near');
      near = found;
      if (near) {
        near.mark.classList.add('near');
        actBtn.innerHTML = `<small>${near.short || near.sign}</small>들어가기`;
        if (navigator.vibrate) navigator.vibrate(8); 
      }
      actBtn.dataset.off = near ? '0' : '1';
    }
    drawFx(dt, now);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  /* ---------- 시작 화면 ---------- */
  document.getElementById('me-doll').innerHTML = doll(myLook);
  const pickList = document.getElementById('pick-list');
  W.GUESTS.forEach((g, i) => {
    const b = document.createElement('button');

      b.setAttribute('aria-pressed', 'true');

      document.getElementById('me-doll').innerHTML = doll(g);
    });
    pickList.appendChild(b);
  });
  app.addEventListener('letter', (e) => {
    const p = PLACES[5];
    addNpc(e.detail, p.fu + p.fv + 70 + npcs.length * 8, -60 + npcs.length * 12, myLook, true);
  });

  for (let i = 0; i < 7; i++) {
    const b = document.createElement('div');
    b.className = 'petal';
    b.style.cssText = `left:${6 + i * 14}%;background:${PASTEL[i % 5]};animation-duration:${11 + i * 1.3}s;animation-delay:${-i * 2.1}s`;
    app.appendChild(b);
  }

  /* ---------- 서울의 시간과 날씨 ---------- */
  const SEOUL = { lat: 37.5636, lon: 126.9869 };
  function seoulNow() {
    const parts = new Intl.DateTimeFormat('en-US', { timeZone: 'Asia/Seoul', hour12: false, year: 'numeric', month: 'numeric', day: 'numeric', hour: 'numeric', minute: 'numeric' }).formatToParts(new Date());
    const get = (t) => +parts.find((x) => x.type === t).value;
    return { y: get('year'), mo: get('month'), d: get('day'), h: get('hour') % 24, m: get('minute') };
  }
  // 날짜로 서울의 해 뜨고 지는 시각(분)을 계산한다
  function sunTimes(t) {
    const n = Math.round((Date.UTC(t.y, t.mo - 1, t.d) - Date.UTC(t.y, 0, 0)) / 864e5);
    const g = 2 * Math.PI / 365 * (n - 1);
    const eq = 229.18 * (.000075 + .001868 * Math.cos(g) - .032077 * Math.sin(g) - .014615 * Math.cos(2 * g) - .040849 * Math.sin(2 * g));
    const dec = .006918 - .399912 * Math.cos(g) + .070257 * Math.sin(g) - .006758 * Math.cos(2 * g) + .000907 * Math.sin(2 * g);
    const lat = SEOUL.lat * Math.PI / 180;
    const ha = Math.acos(Math.cos(90.833 * Math.PI / 180) / (Math.cos(lat) * Math.cos(dec)) - Math.tan(lat) * Math.tan(dec)) * 180 / Math.PI;
    const noon = 720 - 4 * SEOUL.lon - eq + 540;
    return { rise: noon - 4 * ha, set: noon + 4 * ha };
  }
  function phaseNow(t) {
    const m = t.h * 60 + t.m, { rise, set } = sunTimes(t);
    if (m >= rise - 40 && m < rise + 35) return 'dawn';
    if (m >= set - 50 && m < set + 30) return 'dusk';
    return m >= rise && m < set ? 'day' : 'night';
  }

  world.insertAdjacentHTML('beforeend', '<div id="snowcover"></div><div id="tint"></div>');
  const tint = document.getElementById('tint'), snowcover = document.getElementById('snowcover');
  [1480, 1000].forEach((s) => [-197, 197].forEach((d) => {
    const [x, y] = SD(s, d);
    world.insertAdjacentHTML('beforeend', `<div class="glow" style="left:${x}px;top:${y - 72}px"></div>`);
  }));
  for (let i = 0; i < 9; i++) {
    const f = document.createElement('div');
    f.className = 'ff';
    f.style.cssText = `left:${8 + i * 10}%;top:${22 + (i * 37) % 55}%;animation-delay:${-i * 1.1}s,${-i * .7}s`;
    app.appendChild(f);
  }

  const TINTS = { day: null, dawn: 'rgba(246,176,170,.26)', dusk: 'rgba(240,138,92,.32)', night: 'rgba(20,26,66,.62)' };
  const WEATHER_TINT = { clear: null, cloud: 'rgba(120,128,138,.12)', rain: 'rgba(96,110,130,.26)', snow: 'rgba(200,214,232,.2)', fog: 'rgba(214,214,206,.34)' };
  let liveWeather = 'clear';
  function classify(code) {
    if ([71, 73, 75, 77, 85, 86].includes(code)) return 'snow';
    if ((code >= 51 && code <= 67) || (code >= 80 && code <= 82) || code >= 95) return 'rain';
    if (code === 45 || code === 48) return 'fog';
    return code === 3 ? 'cloud' : 'clear';
  }
  function loadWeather() {
    fetch(`https://api.open-meteo.com/v1/forecast?latitude=${SEOUL.lat}&longitude=${SEOUL.lon}&current=weather_code&timezone=Asia%2FSeoul`)
      .then((r) => r.json())
      .then((j) => { liveWeather = classify(j.current.weather_code); applyEnv(); })
      .catch(() => { /* 날씨를 못 받으면 맑은 하늘로 둔다 */ });
  }
  let fxKind = 'clear';
  function setClock(t) {
    const P = PLACES[1], face = P.clockFace, tower = P.el;
    const put = (cls, deg, len) => {
      const line = tower.querySelector('.' + cls), th = deg * Math.PI / 180;
      const A = face(36 + Math.sin(th) * len, 142 + Math.cos(th) * len, 1);
      line.setAttribute('x2', A[0].toFixed(1));
      line.setAttribute('y2', A[1].toFixed(1));
    };
    put('hand-m', t.m * 6, 18);
    put('hand-h', (t.h % 12 + t.m / 60) * 30, 12);
  }
  function applyEnv() {
    const t = seoulNow();
    setClock(t);
    const phase = phaseNow(t), weather = liveWeather;
    const layers = [TINTS[phase], WEATHER_TINT[weather]].filter(Boolean);
    tint.style.background = layers.map((c) => `linear-gradient(${c},${c})`).join(',') || 'none';
    tint.style.zIndex = phase === 'night' ? 1 : 2500;
    world.classList.toggle('nightfall', phase === 'night');
    world.classList.toggle('lit', phase === 'night' || phase === 'dusk');
    app.classList.toggle('night', phase === 'night');
    app.classList.toggle('wet', weather === 'rain' || weather === 'snow');
    snowcover.style.display = weather === 'snow' ? 'block' : 'none';
    fxKind = weather;
    resetFx();
  }

  // 비와 눈은 캔버스 한 장에 그린다
  const fxCanvas = document.getElementById('fx'), fxc = fxCanvas.getContext('2d');
  let drops = [];
  function resetFx() {
    fxCanvas.width = vw; fxCanvas.height = vh;
    fxc.clearRect(0, 0, vw, vh);
    const count = fxKind === 'rain' ? 110 : fxKind === 'snow' ? 80 : 0;
    drops = Array.from({ length: count }, () => ({ x: Math.random() * vw, y: Math.random() * vh, v: .7 + Math.random() * .6, r: 1.4 + Math.random() * 2.2, p: Math.random() * 6.28 }));
  }
  function drawFx(dt, now) {
    if (!drops.length) return;
    fxc.clearRect(0, 0, vw, vh);
    if (fxKind === 'rain') {
      fxc.strokeStyle = 'rgba(205,218,235,.62)';
      fxc.lineWidth = 1.2;
      fxc.beginPath();
      for (const d of drops) {
        d.y += 760 * d.v * dt; d.x -= 110 * d.v * dt;
        if (d.y > vh) { d.y = -20; d.x = Math.random() * (vw + 80); }
        fxc.moveTo(d.x, d.y); fxc.lineTo(d.x + 3.5, d.y - 20 * d.v);
      }
      fxc.stroke();
    } else {
      fxc.fillStyle = 'rgba(255,255,255,.92)';
      fxc.beginPath();
      for (const d of drops) {
        d.y += 62 * d.v * dt;
        d.x += Math.sin(now / 900 + d.p) * 18 * dt;
        if (d.y > vh + 6) { d.y = -6; d.x = Math.random() * vw; }
        fxc.moveTo(d.x + d.r, d.y); fxc.arc(d.x, d.y, d.r, 0, 6.29);
      }
      fxc.fill();
    }
  }
  applyEnv();
  loadWeather();
  setInterval(applyEnv, 20000);
  setInterval(loadWeather, 15 * 60 * 1000);

  /* ---------- 이용 안내 ---------- */
  const GUIDE_ICONS = {
    pin: '<path d="M17 30S6 21 6 13a11 11 0 0 1 22 0c0 8-11 17-11 17z" fill="#96695b"/><circle cx="17" cy="13" r="4" fill="#fbf7ee"/>',
    house: '<path d="M17 4L4 16h4v14h18V16h4z" fill="#dcb1a8"/><rect x="14" y="20" width="6" height="10" fill="#fbf7ee"/>',
    heart: '<path d="M17 29S4 21 4 12a7 7 0 0 1 13-3 7 7 0 0 1 13 3c0 9-13 17-13 17z" fill="#d99c96"/>',
    page: '<rect x="7" y="4" width="20" height="26" fill="#fbf7ee" stroke="#a78a5c" stroke-width="1.500"/><path d="M11 11h12M11 17h12M11 23h8" stroke="#a78a5c" stroke-width="1.500"/>',
    sun: '<circle cx="17" cy="17" r="7" fill="#e8c27e"/><path d="M17 3v5M17 26v5M3 17h5M26 17h5M7 7l3.500 3.500M23.500 23.500L27 27M27 7l-3.500 3.500M10.500 23.500L7 27" stroke="#e8c27e" stroke-width="2" stroke-linecap="round"/>',
  };
  const guideRow = (icon, text) => `<div class="guide-row"><svg viewBox="0 0 34 34" aria-hidden="true">${GUIDE_ICONS[icon]}</svg><p>${text}</p></div>`;
  function openGuide() {
    let close = null;
    close = W.openSheet({
      title: '마을 이용 안내',
      html: `${guideRow('pin', '가고 싶은 곳을 톡 누르면 걸어가요.')}${guideRow('house', '건물을 누르면 바로 들어가서 예식 안내를 볼 수 있어요.')}${guideRow('heart', '하객과 분수, 풍선도 눌러 보세요.')}${guideRow('page', '내용만 빠르게 보려면 위쪽의 <b>한 장으로 보기</b>를 눌러 주세요.')}${guideRow('sun', '마을은 지금 서울의 시간과 날씨를 따라 달라져요.')}
        <div class="btn-row"><button class="btn primary" id="guide-ok">마을 둘러보기</button></div>`,
      bind: (el) => {
        el.querySelector('#guide-ok').addEventListener('click', () => close());
      },
    });
  }
  document.getElementById('guide').addEventListener('click', openGuide);
  function firstGuide() {
    let seen = false;
    try { seen = !!localStorage.getItem('wedding-guide-seen'); localStorage.setItem('wedding-guide-seen', '1'); } catch (e) { seen = false; }
    if (!seen) setTimeout(openGuide, 700);
  }

  // 봉투에서 나온 편지가 그대로 커져 선택 화면이 되고, 양쪽으로 열리며 마을이 된다
  const env = document.getElementById('env'), seal = document.getElementById('seal'), intro = document.getElementById('intro'), paper = document.getElementById('paper');
  me.classList.add('gone');
  function placePaper() {
    const a = app.getBoundingClientRect(), e = env.getBoundingClientRect();
    paper.style.left = e.left - a.left + 12 + 'px';
    paper.style.top = e.top - a.top + 124 + 'px';
    paper.style.width = e.width - 24 + 'px';
    paper.style.height = '188px';
    paper.style.clipPath = 'inset(0 0 104px 0)';
  }
  placePaper();
  let opened = false;
  seal.addEventListener('click', () => {
    if (opened) return;
    opened = true;
    if (navigator.vibrate) navigator.vibrate(18);
    W.sfx('door');
    env.classList.add('open');
    document.getElementById('env-note').style.opacity = 0;
    setTimeout(() => {
      paper.style.top = parseFloat(paper.style.top) - 218 + 'px';
      paper.style.clipPath = 'inset(0 0 0 0)';
    }, 520);
    setTimeout(() => {
      paper.classList.add('grow');
      env.classList.add('away');
      paper.style.left = paper.style.top = '0px';
      paper.style.width = paper.style.height = '100%';
    }, 1750);
    setTimeout(() => { paper.classList.add('ready'); intro.classList.add('clear'); }, 2550);
  });

  document.getElementById('enter').addEventListener('click', () => {
    const a = app.getBoundingClientRect();
    const chosen = pickList.querySelector('[aria-pressed="true"]');
    const r = chosen.querySelector('svg').getBoundingClientRect();
    const fly = document.createElement('div');
    fly.id = 'landing';
    fly.innerHTML = doll(myLook);
    fly.style.cssText = `left:${r.left - a.left}px;top:${r.top - a.top}px;width:${r.width}px;height:${r.height}px`;
    app.appendChild(fly);
    chosen.style.visibility = 'hidden';
    paper.classList.add('gate');
    W.sfx('door');
    requestAnimationFrame(() => requestAnimationFrame(() => {
      const w = 44 * ZOOM, h = 88 * ZOOM;
      fly.style.left = vw / 2 - w / 2 + 'px';
      fly.style.top = vh * ANCHOR - 85 * ZOOM + 'px';
      fly.style.width = w + 'px';
      fly.style.height = h + 'px';
    }));
    setTimeout(() => {
      started = true;
      fly.remove();
      intro.hidden = true;
      me.classList.remove('gone');
      const [x, y] = pr(u, v);
      burst(x, y - 40, 22, PASTEL, 110);
      W.sfx('stamp');
      firstGuide();
    }, 1120);
  });
})();
</script>
</body>
</html>
