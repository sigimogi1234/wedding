<script>
(function () {
  const app = document.getElementById('app');
  const scene = document.getElementById('scene');
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const labels = document.getElementById('labels');
  W.mount(app);
  W.musicButton(document.getElementById('music'));
  document.getElementById('infobar').addEventListener('click', W.openSummary);
  function renderInfo() {
    const d = W.INFO.date, h = d.getHours(), m = d.getMinutes();
    document.getElementById('info-dday').textContent = W.dday();
    document.getElementById('info-date').textContent = `${d.getFullYear()}.${d.getMonth() + 1}.${d.getDate()} (${'일월화수목금토'[d.getDay()]}) ${h < 12 ? '오전' : '오후'} ${h > 12 ? h - 12 : h}:${String(m).padStart(2, '0')}`;
  }
  renderInfo();
  setInterval(renderInfo, 60000);
  document.getElementById('card-date').textContent = W.fmtDate();
  app.addEventListener('contextmenu', (e) => { if (!e.target.closest('input,textarea')) e.preventDefault(); });

  /* ---------- 팔레트와 도트 그리기 ---------- */
  const C = {
    out: '#4b3a3a', grass: '#a8dc8c', tuft: '#8ccb76', grassHi: '#c2e9a6', path: '#f6e7c6', pathLine: '#e8d3a8', pathEdge: '#d6bc8a',
    plaza: '#f2deb8', bed: '#8fcc7a', glass: '#8fd0ee', glassHi: '#dff5ff', lit: '#ffe08a', frame: '#fffaf0', leaf: '#7cc36f',
    pink: '#ff9fb2', yellow: '#ffe08a', water: '#8ad6f2', waterHi: '#d4f3ff', stone: '#efe2c8', skin: '#ffe0c7', blush: '#ffaaa6', eye: '#3b2b2b',
  };
  function rgba(h, a = 255) { const n = parseInt(h.slice(1), 16); return ((a << 24) | ((n & 255) << 16) | (((n >> 8) & 255) << 8) | (n >> 16)) >>> 0; }
  function shade(h, f) {
    const n = parseInt(h.slice(1), 16), c = (x) => Math.round(Math.max(0, Math.min(255, x * f))).toString(16).padStart(2, '0');
    return '#' + c(n >> 16) + c((n >> 8) & 255) + c(n & 255);
  }
  const OUT = rgba(C.out);

  class Raster {
    constructor(x0, y0, w, h) { this.x0 = Math.floor(x0); this.y0 = Math.floor(y0); this.w = Math.ceil(w); this.h = Math.ceil(h); this.d = new Uint32Array(this.w * this.h); }
    idx(x, y) { x = Math.floor(x) - this.x0; y = Math.floor(y) - this.y0; return x >= 0 && y >= 0 && x < this.w && y < this.h ? y * this.w + x : -1; }
    set(x, y, c) { const i = this.idx(x, y); if (i >= 0) this.d[i] = typeof c === 'number' ? c : rgba(c); }
    under(x, y, c) { const i = this.idx(x, y); if (i >= 0 && !this.d[i]) this.d[i] = c; }
    solid(x, y) { const i = this.idx(x, y); return i >= 0 && (this.d[i] >>> 24) === 255; }
    fill(pts, color) {
      const c = typeof color === 'number' ? color : rgba(color);
      let lo = Infinity, hi = -Infinity;
      for (const p of pts) { lo = Math.min(lo, p[1]); hi = Math.max(hi, p[1]); }
      for (let y = Math.floor(lo); y <= Math.ceil(hi); y++) {
        const yc = y + .5, xs = [];
        for (let i = 0; i < pts.length; i++) {
          const a = pts[i], b = pts[(i + 1) % pts.length];
          if ((a[1] <= yc && b[1] > yc) || (b[1] <= yc && a[1] > yc)) xs.push(a[0] + (yc - a[1]) / (b[1] - a[1]) * (b[0] - a[0]));
        }
        xs.sort((p, q) => p - q);
        for (let i = 0; i + 1 < xs.length; i += 2) for (let x = Math.ceil(xs[i] - .5); x <= Math.floor(xs[i + 1] - .5); x++) this.set(x, y, c);
      }
    }
    line(x0, y0, x1, y1, color) {
      const c = typeof color === 'number' ? color : rgba(color);
      x0 = Math.floor(x0); y0 = Math.floor(y0); x1 = Math.floor(x1); y1 = Math.floor(y1);
      const dx = Math.abs(x1 - x0), dy = -Math.abs(y1 - y0), sx = x0 < x1 ? 1 : -1, sy = y0 < y1 ? 1 : -1;
      let err = dx + dy;
      for (;;) {
        this.set(x0, y0, c);
        if (x0 === x1 && y0 === y1) break;
        const e2 = 2 * err;
        if (e2 >= dy) { err += dy; x0 += sx; }
        if (e2 <= dx) { err += dx; y0 += sy; }
      }
    }
    stroke(pts, color) { for (let i = 0; i < pts.length; i++) { const a = pts[i], b = pts[(i + 1) % pts.length]; this.line(a[0], a[1], b[0], b[1], color); } }
    stamp(x, y, rows, map) {
      rows.forEach((row, j) => [...row].forEach((ch, i) => { if (map[ch]) this.set(x + i, y + j, map[ch]); }));
    }
    outline(color = OUT) {
      const src = this.d.slice(), w = this.w, h = this.h;
      const on = (x, y) => x >= 0 && y >= 0 && x < w && y < h && (src[y * w + x] >>> 24) === 255;
      for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
        if ((src[y * w + x] >>> 24) === 255) continue;
        if (on(x - 1, y) || on(x + 1, y) || on(x, y - 1) || on(x, y + 1)) this.d[y * w + x] = color;
      }
    }
    canvas() {
      const cv = document.createElement('canvas');
      cv.width = this.w; cv.height = this.h;
      cv.getContext('2d').putImageData(new ImageData(new Uint8ClampedArray(this.d.buffer.slice(0)), this.w, this.h), 0, 0);
      return cv;
    }
  }
  // 명령을 모아 범위를 잰 뒤 한 번에 칠한다
  function paint(cmds, opts = {}) {
    let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
    const grow = (p) => { x0 = Math.min(x0, p[0]); y0 = Math.min(y0, p[1]); x1 = Math.max(x1, p[0]); y1 = Math.max(y1, p[1]); };
    for (const c of cmds) (c[0] === 'f' || c[0] === 's' ? c[1] : [c[1], c[2] && c[0] === 'l' ? c[2] : c[1]]).forEach(grow);
    const pad = 4;
    const r = new Raster(x0 - pad, y0 - pad, x1 - x0 + pad * 2 + 2, y1 - y0 + pad * 2 + 2);
    for (const c of cmds) {
      if (c[0] === 'f') r.fill(c[1], c[2]);
      else if (c[0] === 's') r.stroke(c[1], c[2]);
      else if (c[0] === 'l') r.line(c[1][0], c[1][1], c[2][0], c[2][1], c[3]);

  /* ---------- 터치: 끌면 화면이 움직이고, 톡 누르면 걸어간다 ---------- */

  /* ---------- 시간과 날씨 ---------- */
  const SEOUL = { lat: 37.5636, lon: 126.9869 };
  function seoulNow() {
    const parts = new Intl.DateTimeFormat('en-US', { timeZone: 'Asia/Seoul', hour12: false, year: 'numeric', month: 'numeric', day: 'numeric', hour: 'numeric', minute: 'numeric' }).formatToParts(new Date());
    const get = (t) => +parts.find((x) => x.type === t).value;

  }
  function sunTimes(t) {
    const n = Math.round((Date.UTC(t.y, t.mo - 1, t.d) - Date.UTC(t.y, 0, 0)) / 864e5);

    const eq = 229.18 * (.000075 + .001868 * Math.cos(g) - .032077 * Math.sin(g) - .014615 * Math.cos(2 * g) - .040849 * Math.sin(2 * g));
    const dec = .006918 - .399912 * Math.cos(g) + .070257 * Math.sin(g) - .006758 * Math.cos(2 * g) + .000907 * Math.sin(2 * g);
    const lat = SEOUL.lat * Math.PI / 180;
    const ha = Math.acos(Math.cos(90.833 * Math.PI / 180) / (Math.cos(lat) * Math.cos(dec)) - Math.tan(lat) * Math.tan(dec)) * 180 / Math.PI;
    const noon = 720 - 4 * SEOUL.lon - eq + 540;

  const WEATHER_TINT = { cloud: 'rgba(120,130,150,.12)', rain: 'rgba(90,110,150,.22)', snow: 'rgba(210,225,255,.16)', fog: 'rgba(230,230,230,.3)' };

  function loadWeather() {

      .then((r) => r.json())

    const n = env.weather === 'rain' ? 70 : env.weather === 'snow' ? 60 : 0;
    drops = Array.from({ length: n }, () => ({ x: Math.random() * Wa, y: Math.random() * Ha, v: .7 + Math.random() * .6, p: Math.random() * 6, big: Math.random() < .3 }));

  }

  /* ---------- 매 프레임 ---------- */
  const SPEED = 118;
  function frame(now) {
    const dt = Math.min(.05, (now - last) / 1000 || 0);
    last = now;
    if (app.clientWidth !== lastW || app.clientHeight !== lastH) { lastW = app.clientWidth; lastH = app.clientHeight; resize(); clampCam(); }

    }

    // 카메라: 손으로 끌거나 관성으로 미끄러지고, 캐릭터가 화면 밖으로 나가려 할 때만 살짝 따라간다

  }
  let lastW = 0, lastH = 0, footAcc = 0;

  function draw(now, dt) {
    const ox = Math.floor(camX), oy = Math.floor(camY);
    canvas.style.transform = `translate(${-(camX - ox) * P}px,${-(camY - oy) * P}px)`;
    ctx.clearRect(0, 0, Wa + 1, Ha + 1);
    ctx.fillStyle = C.grass; ctx.fillRect(0, 0, Wa + 1, Ha + 1);
    ctx.drawImage(ground.cv, ground.x0 - ox, ground.y0 - oy);
    if (env.weather === 'snow') { ctx.fillStyle = 'rgba(255,255,255,.5)'; ctx.fillRect(0, 0, Wa + 1, Ha + 1); }
    if (env.phase === 'night') { ctx.fillStyle = TINTS.night; ctx.fillRect(0, 0, Wa + 1, Ha + 1); }

    PLACES.forEach((p) => { const [X, Y] = pr(p.fu, p.fv), m = near === p ? MAT_ON : MAT; ctx.drawImage(m.cv, Math.round(m.x0 + X - ox), Math.round(m.y0 + Y - oy)); });
    PLACES.forEach((p) => { ctx.globalAlpha = .13; ctx.drawImage(p.shadow.cv, p.shadow.x0 + p.X - ox, p.shadow.y0 + p.Y - oy); ctx.globalAlpha = 1; });
    foots.forEach((f) => { f.t += dt; if (f.t < 1.3) { ctx.globalAlpha = .45 * (1 - f.t / 1.3); ctx.fillStyle = '#b89a78'; ctx.fillRect(Math.round(f.x - ox), Math.round(f.y - oy), 2, 1); } });
    ctx.globalAlpha = 1;
    ripples.forEach((r) => { r.t += dt; const k = Math.min(1, r.t / .35), rx = Math.round(3 + k * 7); ctx.globalAlpha = 1 - k; ctx.fillStyle = '#ff7f98'; ctx.fillRect(Math.round(r.x - rx - ox), Math.round(r.y - oy), 2, 1); ctx.fillRect(Math.round(r.x + rx - 1 - ox), Math.round(r.y - oy), 2, 1); ctx.fillRect(Math.round(r.x - ox), Math.round(r.y - rx / 2 - oy), 1, 1); ctx.fillRect(Math.round(r.x - ox), Math.round(r.y + rx / 2 - oy), 1, 1); });
    ctx.globalAlpha = 1;
    for (let i = ripples.length - 1; i >= 0; i--) if (ripples[i].t > .35) ripples.splice(i, 1);

    if (path.length) {
      const pts = [pr(u, v), ...path.map(([a, b]) => pr(a, b))];
      const phase = (now / 70) % 6;
      ctx.fillStyle = '#ff7f98';
      let carry = 6 - phase;
      for (let i = 0; i + 1 < pts.length; i++) {
        const [x0, y0] = pts[i], [x1, y1] = pts[i + 1], len = Math.hypot(x1 - x0, y1 - y0);
        for (let t = carry; t < len; t += 6) ctx.fillRect(Math.round(x0 + (x1 - x0) * t / len - ox), Math.round(y0 + (y1 - y0) * t / len - oy), 2, 1);
        carry = (carry - len) % 6; if (carry < 0) carry += 6;
      }
    }
    if (dest) ctx.drawImage(PIN, Math.round(dest[0] - 6 - ox), Math.round(dest[1] - 14 - oy - (Math.floor(now / 250) % 2)));

    const dyn = npcs.concat(animals, [me]).sort((a, b) => a.key - b.key);
    let j = 0;
    for (const it of statics) { while (j < dyn.length && dyn[j].key <= it.key) dyn[j++].draw(ox, oy, now); it.draw(ox, oy, now); }
    while (j < dyn.length) dyn[j++].draw(ox, oy, now);
    // 개울 물빛
    ctx.fillStyle = 'rgba(255,255,255,.75)';
    for (let i = 0; i < 70; i++) {
      const Y = ((i * 31 + now * .025 * (1 + (i % 3) * .3)) % 1100) - 230, X = streamX(Y) + (hash(i, 5) - .5) * streamW(Y) * 1.4;
      const x = Math.round(X - ox), y = Math.round(Y - oy);
      if (x > -4 && x < Wa + 4 && y > -4 && y < Ha + 4) ctx.fillRect(x, y, 2, 1);
    }

    if (env.phase !== 'night' && env.weather !== 'rain') butterflies.forEach((b, i) => {
      const t = now / 1000 + b.p, x = Math.round(b.x + Math.sin(t * .7) * 16 + Math.sin(t * 2.3) * 3 - ox), y = Math.round(b.y + Math.cos(t * .9) * 8 - 10 - oy), open = Math.floor(now / 110 + i) % 2;
      ctx.fillStyle = b.c;
      if (open) { ctx.fillRect(x - 2, y, 2, 2); ctx.fillRect(x + 1, y, 2, 2); } else { ctx.fillRect(x - 1, y, 1, 2); ctx.fillRect(x + 1, y, 1, 2); }
      ctx.fillStyle = C.out; ctx.fillRect(x, y, 1, 2);
    });
    if (env.phase !== 'night') { const t = Math.floor(now / 120) % 4; ctx.fillStyle = C.waterHi; [[-4, -24], [4, -23], [-2, -27], [3, -26]].forEach(([x, y], i) => { const k = (t + i) % 4; ctx.fillRect(Math.round(fountain.X + x * (1 + k * .3) - ox), Math.round(fountain.Y + y + k * 2 - oy), 1, 1); }); }

    drawFishing(ox, oy, now);
    drawFruits(dt, ox, oy);
    npcs.forEach((n) => {
      const bob = Math.floor(now / 500 + n.phase) % 2;
      ctx.drawImage(BUBBLES[n.icon], Math.round(n.X - 6 - ox), Math.round(n.Y - 37 - oy - bob));
    });

    for (let i = bits.length - 1; i >= 0; i--) {
      const b = bits[i]; b.life -= dt; b.x += b.vx * dt; b.y += b.vy * dt; b.vy += 70 * dt;
      if (b.life <= 0) { bits.splice(i, 1); continue; }
      ctx.fillStyle = b.c; ctx.fillRect(Math.round(b.x - ox), Math.round(b.y - oy), 2, 2);
    }
    for (let i = floaters.length - 1; i >= 0; i--) {
      const f = floaters[i]; f.t += dt; f.y -= 34 * dt; f.x += Math.sin(f.t * 2) * 6 * dt;
      if (f.t > 6) { floaters.splice(i, 1); continue; }
      const x = Math.round(f.x - ox), y = Math.round(f.y - oy);
      ctx.fillStyle = C.out; ctx.fillRect(x - 3, y - 4, 7, 9); ctx.fillStyle = f.c; ctx.fillRect(x - 2, y - 3, 5, 7); ctx.fillStyle = '#fff'; ctx.fillRect(x - 1, y - 2, 1, 1); ctx.fillStyle = '#7a6464'; ctx.fillRect(x, y + 5, 1, 6);
    }

    const tints = [env.phase !== 'night' && TINTS[env.phase], WEATHER_TINT[env.weather]].filter(Boolean);
    tints.forEach((c) => { ctx.fillStyle = c; ctx.fillRect(0, 0, Wa + 1, Ha + 1); });

    if (env.lit) LAMPS.forEach((l) => {
      const x = Math.round(l.X - ox), y = Math.round(l.Y - 31 - oy);
      ctx.fillStyle = 'rgba(255,224,138,.22)';
      ctx.fillRect(x - 6, y - 3, 12, 6); ctx.fillRect(x - 4, y - 5, 8, 10);
    });

    if (env.weather === 'rain') {
      ctx.fillStyle = 'rgba(214,232,255,.75)';
      for (const d of drops) { d.y += 260 * d.v * dt; d.x -= 40 * d.v * dt; if (d.y > Ha) { d.y = -6; d.x = Math.random() * (Wa + 30); } ctx.fillRect(Math.round(d.x), Math.round(d.y), 1, 4); ctx.fillRect(Math.round(d.x) + 1, Math.round(d.y) - 3, 1, 2); }
    } else if (env.weather === 'snow') {
      ctx.fillStyle = '#ffffff';
      for (const d of drops) { d.y += 22 * d.v * dt; d.x += Math.sin(now / 900 + d.p) * 8 * dt; if (d.y > Ha + 2) { d.y = -2; d.x = Math.random() * Wa; } const s = d.big ? 2 : 1; ctx.fillRect(Math.round(d.x), Math.round(d.y), s, s); }
    }
    for (let i = petals.length - 1; i >= 0; i--) {
      const p = petals[i]; p.y += p.v * dt; p.x += (Math.sin(now / 900 + p.p) * 10 + 4) * dt;
      if (p.y > Ha + 3) { if (p.burst) { petals.splice(i, 1); continue; } p.y = -3; p.x = Math.random() * Wa; }
      ctx.fillStyle = p.c; const f = Math.floor(now / 380 + p.p) % 2;
      ctx.globalAlpha = p.soft ? .7 : 1;
      ctx.fillRect(Math.round(p.x), Math.round(p.y), f ? 2 : 1, f ? 1 : 2);
      ctx.globalAlpha = 1;
    }
    flies.forEach((f) => {
      const on = (Math.sin(now / 400 + f.p) + 1) / 2, x = Math.round(f.x + Math.sin(now / 1500 + f.p) * 12), y = Math.round(f.y + Math.cos(now / 1900 + f.p) * 8);
      ctx.globalAlpha = .3 * on; ctx.fillStyle = '#fff3a8'; ctx.fillRect(x - 1, y - 1, 3, 3);
      ctx.globalAlpha = on; ctx.fillRect(x, y, 1, 1);
    });
    ctx.globalAlpha = 1;

    // 이름표가 화면 밖으로 나가면 가장자리에 붙여 둔다
    const vw = app.clientWidth, widths = PLACES.map((p) => p.plaque.offsetWidth);
    gateLabel.holder.style.transform = `translate(${((gateLabel.labelX - camX) * P).toFixed(1)}px,${((gateLabel.labelY - camY) * P).toFixed(1)}px)`;
    PLACES.forEach((p, i) => {
      let x = (p.labelX - camX) * P;
      if (p.side < 0) x = Math.max(x, widths[i] + 6); else x = Math.min(x, vw - widths[i] - 6);
      p.holder.style.transform = `translate(${x.toFixed(1)}px,${((p.labelY - camY) * P).toFixed(1)}px)`;
    });
  }

  /* ---------- 이용 안내 ---------- */
  function iconCanvas(rows, map) { const r = new Raster(0, 0, 12, 12); r.stamp(0, 0, rows, map); return r.canvas(); }
  const GUIDE = [
    [['....pppp....', '...pppppp...', '..pppwwppp..', '..pppwwppp..', '..pppppppp..', '...pppppp...', '....pppp....', '.....pp.....', '.....pp.....', '............'], '가고 싶은 곳을 톡 누르면 걸어가요.'],
    [['.....rr.....', '....rrrr....', '...rrrrrr...', '..rrrrrrrr..', '.rrrrrrrrrr.', '..cccccccc..', '..cbbccbbc..', '..cbbccbbc..', '..ccc..ccc..', '..ccc..ccc..'], '건물을 누르면 바로 들어가서 예식 안내를 볼 수 있어요.'],
    [['............', '.oooooooooo.', '.owwwwwwwwo.', '.owoowoowwo.', '.owwwwwwwwo.', '.oooooooooo.', '....oo......', '...o........'], '하객을 누르면 축하 메시지가 나와요. 분수와 풍선도 눌러 보세요.'],
    [['..oooooooo..', '..owwwwwwo..', '..owooooow..', '..owwwwwwo..', '..owoooowo..', '..owwwwwwo..', '..owooowwo..', '..oooooooo..'], '화면을 끌면 마을을 둘러볼 수 있고, 두 손가락이나 +/− 버튼으로 확대·축소할 수 있어요. 예식 정보는 아래쪽 안내 바를 누르면 한 번에 볼 수 있어요.'],
    [['............', '...oo.......', '..owwo......', '..owwo....o.', '...oo....o..', '....o...o...', '....o..o....', '....o.o.....', '....oo......', '....o.......'], '연못 앞에서 <b>낚시</b>를 해 보세요. 나무를 누르면 흔들려서 열매가 떨어지기도 해요.'],
    [['.....yy.....', '..y..yy..y..', '...yyyyyy...', '..yyyyyyyy..', 'yyyyyyyyyyyy', '..yyyyyyyy..', '...yyyyyy...', '..y..yy..y..', '.....yy.....'], '마을은 지금 서울의 시간과 날씨를 따라 달라져요.'],
  ];
  const GUIDE_MAP = { p: '#ff7f98', w: '#ffffff', r: '#f19a9a', c: '#fff4e0', b: '#8fd0ee', o: C.out, y: '#ffd36b' };
  const PREVIEWS = [['실제', {}], ['일출', { phase: 'dawn' }], ['낮', { phase: 'day', weather: 'clear' }], ['해질녘', { phase: 'dusk', weather: 'clear' }], ['밤', { phase: 'night', weather: 'clear' }], ['비', { phase: 'day', weather: 'rain' }], ['눈', { phase: 'day', weather: 'snow' }], ['밤 눈', { phase: 'night', weather: 'snow' }]];
  function openGuide() {
    let close = null;
    close = W.openSheet({
      title: '마을 이용 안내',
      html: `${GUIDE.map((g, i) => `<div class="guide-row"><canvas data-g="${i}"></canvas><p>${g[1]}</p></div>`).join('')}
        <div class="btn-row"><button class="btn primary" id="guide-ok">마을 둘러보기</button></div>`,
      bind: (el) => {
        el.querySelectorAll('[data-g]').forEach((c) => { const src = iconCanvas(GUIDE[+c.dataset.g][0], GUIDE_MAP); c.width = 12; c.height = 12; c.getContext('2d').drawImage(src, 0, 0); });
        el.querySelector('#guide-ok').addEventListener('click', () => close());
        el.querySelectorAll('[data-p]').forEach((b) => b.addEventListener('click', () => { preview = PREVIEWS[+b.dataset.p][1]; applyEnv(); close(); }));
      },
    });
  }
  document.getElementById('guide').addEventListener('click', openGuide);
  function firstGuide() {
    let seen = false;
    try { seen = !!localStorage.getItem('wedding-guide-seen-8bit'); localStorage.setItem('wedding-guide-seen-8bit', '1'); } catch (e) { seen = false; }
    if (!seen) setTimeout(openGuide, 600);
  }

  app.addEventListener('letter', (e) => {
    const p = PLACES[5];
    addNpc(e.detail, p.fu + p.fv + 70 + npcs.length * 8, -60 + npcs.length * 12, myLook, 'letter');
  });

  /* ---------- 시작 ---------- */
  statics.sort((a, b) => a.key - b.key);
  resize();
  [camX, camY] = centerOn(...pr(u, v), .62);
  clampCam();
  lastW = app.clientWidth; lastH = app.clientHeight;
  applyEnv();
  loadWeather();
  setInterval(applyEnv, 20000);
  setInterval(loadWeather, 15 * 60 * 1000);
  requestAnimationFrame(frame);

  // 봉투 도트 그림
  function envArt() {
    // 봉투는 1도트 = 4 CSS px
    const put = (id, w, h, cmds) => {
      const art = paint(cmds), c = document.getElementById(id);
      c.width = art.r.w; c.height = art.r.h;
      c.getContext('2d').drawImage(art.cv, 0, 0);
      Object.assign(c.style, { left: art.x0 * 4 + 'px', top: art.y0 * 4 + 'px', width: art.r.w * 4 + 'px', height: art.r.h * 4 + 'px', transformOrigin: `50% ${-art.y0 * 4}px` });
      return art;
    };
    put('env-back', 78, 52, [['f', [[0, 0], [77, 0], [77, 51], [0, 51]], '#f3b7c2']]);
    put('env-front', 78, 52, [['f', [[0, 0], [39, 30], [77, 0], [77, 51], [0, 51]], '#ffd3dc'], ['l', [0, 51], [30, 26], '#f3b7c2'], ['l', [77, 51], [48, 26], '#f3b7c2']]);
    put('env-flap', 78, 34, [['f', [[0, 0], [77, 0], [39, 33]], '#ffc2cf'], ['l', [6, 2], [39, 28], '#ffd9e1']]);
    const seal = new Raster(0, 0, 16, 16);
    seal.fill(circlePts(8, 8, 7, 7, 20), '#e86a7e');
    seal.stamp(4, 5, ['.ww.ww.', 'wwwwwww', 'wwwwwww', '.wwwww.', '..www..', '...w...'], { w: '#ffffff' });
    seal.outline();
    const sc = document.getElementById('seal-art'); sc.width = 16; sc.height = 16; sc.getContext('2d').drawImage(seal.canvas(), 0, 0);
  }
  envArt();

  const pickList = document.getElementById('pick-list');
  LOOKS.forEach((g, i) => {
    const b = document.createElement('button');
    const c = document.createElement('canvas');
    c.width = 16; c.height = 25;
    c.getContext('2d').drawImage(minimi(g).front[0], 0, 0);
    b.appendChild(c);
    b.setAttribute('aria-label', `모습 ${i + 1}`);
    b.setAttribute('aria-pressed', String(i === 0));
    b.addEventListener('click', () => {
      pickList.querySelectorAll('button').forEach((x) => x.setAttribute('aria-pressed', 'false'));
      b.setAttribute('aria-pressed', 'true');
      myLook = g; mySprite = minimi(g);
      W.sfx('tap');
    });
    pickList.appendChild(b);
  });

  const envEl = document.getElementById('env'), seal = document.getElementById('seal'), intro = document.getElementById('intro'), paper = document.getElementById('paper');
  function placePaper() {
    const a = app.getBoundingClientRect(), e = envEl.getBoundingClientRect();
    paper.style.left = e.left - a.left + 14 + 'px';
    paper.style.top = e.top - a.top + 124 + 'px';
    paper.style.width = e.width - 28 + 'px';
    paper.style.height = '188px';
    paper.style.clipPath = 'inset(0 0 104px 0)';
  }
  placePaper();
  let opened = false;
  seal.addEventListener('click', () => {
    if (opened) return;
    opened = true;
    if (navigator.vibrate) navigator.vibrate(18);
    W.sfx('door');
    envEl.classList.add('open');
    document.getElementById('env-note').style.opacity = 0;
    setTimeout(() => { paper.style.top = parseFloat(paper.style.top) - 218 + 'px'; paper.style.clipPath = 'inset(0 0 0 0)'; }, 520);
    setTimeout(() => {
      paper.classList.add('grow');
      envEl.classList.add('away');
      paper.style.left = paper.style.top = '0px';
      paper.style.width = paper.style.height = '100%';
    }, 1750);
    setTimeout(() => { paper.classList.add('ready'); intro.classList.add('clear'); }, 2400);
  });

  document.getElementById('enter').addEventListener('click', () => {
    const a = app.getBoundingClientRect();
    const chosen = pickList.querySelector('[aria-pressed="true"]');
    const r = chosen.querySelector('canvas').getBoundingClientRect();
    const fly = document.createElement('canvas');
    fly.id = 'landing';
    fly.width = 16; fly.height = 25;
    fly.getContext('2d').drawImage(mySprite.front[0], 0, 0);
    fly.style.cssText = `left:${r.left - a.left}px;top:${r.top - a.top}px;width:${r.width}px;height:${r.height}px`;
    app.appendChild(fly);
    chosen.style.visibility = 'hidden';
    paper.classList.add('gate');
    W.sfx('door');
    const [X, Y] = pr(u, v);
    requestAnimationFrame(() => requestAnimationFrame(() => {
      fly.style.left = (Math.round(X - 8) - camX) * P + 'px';
      fly.style.top = (Math.round(Y - 23) - camY) * P + 'px';
      fly.style.width = 16 * P + 'px';
      fly.style.height = 25 * P + 'px';
    }));
    setTimeout(() => {
      started = true; busy = false; hidden = false;
      fly.remove();
      intro.hidden = true;
      burst(X, Y - 12, 22, PASTEL, 34);
      W.sfx('stamp');
      firstGuide();
    }, 980);
  });
})();
</script>
</body>
